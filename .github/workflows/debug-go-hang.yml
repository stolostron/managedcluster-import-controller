name: Debug go hang on ubuntu images

on:
  workflow_dispatch:
  push:
    branches: [debug/go-hang]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.0'

      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null

      - name: Versions
        run: |
          uname -r
          make --version | head -1
          sh -c 'echo /bin/sh -> $(readlink -f /bin/sh)'
          go version

      - name: Isolate make shell-function variants
        run: |
          mk() { printf "%s\n" "$2" > /tmp/Mk.$1; }
          # variant: single command, no pipe
          mk plain 'X := $(shell go env GOPATH)
          all: ; @echo DONE-plain'
          # variant: one pipe stage
          mk pipe1 'X := $(shell go env GOPATH | grep GOPATH)
          all: ; @echo DONE-pipe1'
          # variant: two pipe stages
          mk pipe2 'X := $(shell go env GOPATH | grep GOPATH | grep -v NOMATCH)
          all: ; @echo DONE-pipe2'
          # variant: trivial builtin, no pipe
          mk echo 'X := $(shell echo hello)
          all: ; @echo DONE-echo'
          # variant: sleep (no output)
          mk sleep 'X := $(shell sleep 2)
          all: ; @echo DONE-sleep'
          # variant: cat file, no pipe
          mk cat 'X := $(shell cat go.mod)
          all: ; @echo DONE-cat'
          # variant: cat file piped once
          mk catpipe 'X := $(shell cat go.mod | head -1)
          all: ; @echo DONE-catpipe'
          for v in plain pipe1 pipe2 echo sleep cat catpipe; do
            echo "===== variant: $v"
            start=$(date +%s)
            if timeout 120 make -f /tmp/Mk.$v > /tmp/out.$v 2>&1; then
              echo "OK in $(( $(date +%s) - start ))s: $(cat /tmp/out.$v | head -1)"
            else
              echo "HUNG/TIMEOUT after $(( $(date +%s) - start ))s (output: $(head -c 200 /tmp/out.$v))"
            fi
          done

      - name: The real GOPACKAGES line
        run: |
          printf 'GOPACKAGES = $(shell go list ./... | grep -v /manager | grep -v /bindata | grep -v /vendor | grep -v /internal | grep -v /build | grep -v /test)\nall: ; @echo DONE-real\n' > /tmp/Mk.real
          echo "===== variant: real GOPACKAGES pipeline (600s cap)"
          start=$(date +%s)
          if timeout 600 make -f /tmp/Mk.real > /tmp/out.real 2>&1; then
            echo "OK in $(( $(date +%s) - start ))s"
          else
            echo "HUNG after $(( $(date +%s) - start ))s"
          fi

      - name: strace make on a single shell-function expansion
        run: |
          printf 'X := $(shell go env GOPATH)\nall: ; @echo DONE\n' > /tmp/Mk.strace
          strace -f -tt -T -o /tmp/make.strace timeout 300 make -f /tmp/Mk.strace > /dev/null 2>&1 || true
          echo "=== make strace: last 40 lines"
          tail -40 /tmp/make.strace
          echo "=== slowest syscalls (top 10 by duration)"
          grep -oE '<[0-9]+\.[0-9]+>$' /tmp/make.strace | tr -d '<>' | sort -rn | head -10
          echo "=== syscall histogram"
          awk -F'[()]' '/^[0-9]/ {print $2}' /tmp/make.strace | awk '{print $1}' | sort | uniq -c | sort -rn | head -15
