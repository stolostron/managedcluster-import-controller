name: Debug go hang on ubuntu images

on:
  workflow_dispatch:
  push:
    branches: [debug/go-hang]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.0'

      - name: Env-var bisect on bare go list
        run: |
          for kv in "CGO_ENABLED=1" "GO111MODULE=on" "GOFLAGS=" "GOHOSTOS=linux" "GOHOSTARCH=amd64" "GOPATH=/home/runner/go"; do
            echo "===== env $kv go list ./..."
            start=$(date +%s)
            if timeout 90 env "$kv" go list ./... > /dev/null 2>&1; then
              echo "OK in $(( $(date +%s) - start ))s"
            else
              echo "HUNG/FAIL after $(( $(date +%s) - start ))s"
            fi
          done

      - name: Shell bisect on the exact pipeline
        run: |
          PIPE='go list ./... | grep -v /manager | grep -v /bindata | grep -v /vendor | grep -v /internal | grep -v /build | grep -v /test'
          for sh in sh bash; do
            echo "===== $sh -c pipeline"
            start=$(date +%s)
            if timeout 90 $sh -c "$PIPE" > /dev/null 2>&1; then
              echo "OK in $(( $(date +%s) - start ))s"
            else
              echo "HUNG after $(( $(date +%s) - start ))s"
            fi
          done

      - name: SHELL bisect in make
        run: |
          printf 'SHELL := /bin/bash\nexport GOPACKAGES = $(shell go list ./... | grep -v /manager | grep -v /bindata | grep -v /vendor | grep -v /internal | grep -v /build | grep -v /test)\nall: ; @echo DONE-bashshell\n' > /tmp/Mk.bashshell
          printf 'SHELL := /bin/sh\nexport GOPACKAGES = $(shell go list ./... | grep -v /manager | grep -v /bindata | grep -v /vendor | grep -v /internal | grep -v /build | grep -v /test)\nall: ; @echo DONE-shshell\n' > /tmp/Mk.shshell
          for v in bashshell shshell; do
            echo "===== make -f Mk.$v"
            start=$(date +%s)
            if timeout 120 make -f /tmp/Mk.$v > /tmp/out.$v 2>&1; then
              echo "OK in $(( $(date +%s) - start ))s: $(head -1 /tmp/out.$v)"
            else
              echo "HUNG after $(( $(date +%s) - start ))s"
            fi
          done

      - name: Override SHELL on the real Makefile
        run: |
          for shv in /bin/sh /bin/dash /bin/bash; do
            echo "===== make -n build-image SHELL=$shv"
            start=$(date +%s)
            if timeout 120 make -n build-image SHELL=$shv > /tmp/mk.out 2>&1; then
              echo "OK in $(( $(date +%s) - start ))s"
            else
              echo "HUNG after $(( $(date +%s) - start ))s"
            fi
          done

      - name: Full-env reproduction and unfiltered process tree
        run: |
          echo "===== make -n build-image (default), ps snapshot at t=30s"
          timeout 60 make -n build-image > /tmp/mk2.out 2>&1 &
          mkpid=$!
          sleep 30
          ps -ef --forest | sed -n '/make -n build-image/,$p' | head -25
          wait $mkpid || true
          echo "===== /tmp usage:"
          df -h /tmp | tail -1
