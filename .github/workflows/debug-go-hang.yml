name: Debug go hang on ubuntu images

on:
  workflow_dispatch:
  push:
    branches: [debug/go-hang]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.0'

      - name: Install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null

      - name: What does make exec in a loop (process-event strace)
        run: |
          strace -f -qq -e trace=execve,exit_group -o /tmp/procs.strace timeout 60 make -n build-image > /dev/null 2>&1 || true
          echo "=== total execve count: $(grep -c execve /tmp/procs.strace)"
          echo "=== execve command histogram (top 15):"
          grep execve /tmp/procs.strace | sed 's/.*execve("\([^"]*\)".*/\1/' | sort | uniq -c | sort -rn | head -15
          echo "=== first 10 execve lines:"
          grep execve /tmp/procs.strace | head -10 | cut -c1-170
          echo "=== last 10 execve lines:"
          grep execve /tmp/procs.strace | tail -10 | cut -c1-170

      - name: make's own debug trace
        run: |
          timeout 45 make -d -n build-image > /tmp/maked.log 2>&1 || true
          echo "=== make -d output lines: $(wc -l < /tmp/maked.log)"
          echo "=== first 40 lines:"
          head -40 /tmp/maked.log
          echo "=== last 40 lines:"
          tail -40 /tmp/maked.log
